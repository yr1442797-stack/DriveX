<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Modals</title>
  <link rel="stylesheet" href="style2.css">

</head>

<body>

  <header>
    <h1>Car Showcase</h1>
    <p>Explore 15 Iconic Sports, Electric, and Luxury Cars</p>
  </header>

  <div class="filter-container">
    <button class="filter-btn active" onclick="filterCars('all')">All Cars</button>
    <button class="filter-btn" onclick="filterCars('Sports')">Sports</button>
    <button class="filter-btn" onclick="filterCars('Electric')">Electric</button>
    <button class="filter-btn" onclick="filterCars('Luxury')">Luxury</button>
   <button class="filter-btn"> <a href="index.html">Home</a></button>
  </div>

  <div class="gallery" id="carGallery"></div>

  <div class="modal" id="carModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle" style="color: #38bdf8; margin-bottom: 0.5rem;"></h2>
      <p id="modalCategory" style="font-size: 0.9rem; color: #818cf8; margin-bottom: 1rem;"></p>
      <p id="modalDesc" style="color: #cbd5e1; line-height: 1.5;"></p>
    </div>
  </div>


  <script src="script2.js"></script>

</body>

</html>
